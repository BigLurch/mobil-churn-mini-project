
name: CI

on:
  push:
    branches: [main]
  
  pull_request:
    branches: [main]
  
  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  workflow_dispatch:
    inputs:
      datafil:
        description: "Välj CSV-fil för datavalidering"
        required: true
        type: choice
        default: "data/kundbas.csv"
        options:
          - "data/kundbas.csv"
          - "data/kundbas_ny_leverans.csv"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  andringar:
    name: Kontrollera ändrade filer
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read
    
    outputs:
      ci: ${{ steps.decision.outputs.ci }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Identifiera relevanta ändringar
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci:
              - 'src/**'
              - 'data/**'
              - 'tests/**'
              - 'kontroller/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Dockerfile'
              - 'docker/**'
              - '.dockerignore'
              - 'scripts/**'
              - 'k8s/**'

      - name: Bestäm om CI behövs
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.ci }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$CHANGED" == "true" ]]; then
            echo "ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: andringar
    if: needs.andringar.outputs.ci == 'true'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen --no-sync --python "${{ matrix.python-version }}" python -m pytest -v

  
  datakontroll:
    name: Validate customer data
    needs: andringar
    if: needs.andringar.outputs.ci == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python-env 
        with:
          python-version: "3.11"

      - name: Validate original customer data
        env:
          DATAFIL: ${{ inputs.datafil || 'data/kundbas.csv' }}
        run: uv run --frozen --no-sync python -m kontroller.validate_data "$DATAFIL"


  train:
    name: Train model
    needs: [test, datakontroll]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Train model
        env:
          MLFLOW_RUN_NAME: model-ci-${{ github.run_number }}-${{ github.run_attempt }}
        run: uv run --frozen --no-sync python -m churn.model

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

      # Keep the database and artifact files together.
      - name: Package MLflow results
        run: tar -czf mlflow-tracking.tar.gz mlflow.db mlruns/

      # Save the archive for this workflow run.
      - name: Upload MLflow results
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-${{ github.sha }}
          path: mlflow-tracking.tar.gz
          if-no-files-found: error
  utvardera:
    name: Evaluate model
    needs: train
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Evaluate model quality
        run: uv run --frozen --no-sync python -m churn.evaluate

      - name: Write metrics to Summary
        if: always()
        run: |
          if [ -f outputs/matvarden.json ]; then
            echo "## Model evaluation" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  
  docker:
    name: Build and smoke-test Docker image
    needs: utvardera
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Verify model commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              Path("outputs/matvarden.json").read_text()
          )
          actual = metadata["commit"]
          expected = os.environ["EXPECTED_SHA"]

          if actual != expected:
              raise SystemExit(
                  f"Model commit mismatch: {actual} != {expected}"
              )

          print("PASS: Model commit matches workflow commit")
          PY
     

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
     
      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: churn-docker:ci
          cache-from: type=gha,scope=churn-vg
          cache-to: type=gha,scope=churn-vg,mode=max

      - name: Run Docker smoke-test
        run: bash scripts/smoke_test.sh churn-docker:ci

      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'BigLurch/mobil-churn-mini-project'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'BigLurch/mobil-churn-mini-project'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/biglurch/mobil-churn-mini-project:${{ github.sha }}
          cache-from: type=gha,scope=churn-vg
          cache-to: type=gha,scope=churn-vg,mode=max
   
      - name: Inspect and verify published image platforms
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'BigLurch/mobil-churn-mini-project'
        env:
          IMAGE: ghcr.io/biglurch/mobil-churn-mini-project:${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE"

          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json

          python - <<'PY'
          import json

          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)

          platforms = {
              (item["platform"]["os"], item["platform"]["architecture"])
              for item in manifest.get("manifests", [])
              if "platform" in item
          }

          required = {("linux", "amd64"), ("linux", "arm64")}
          missing = required - platforms

          if missing:
              raise SystemExit(f"Missing required platforms: {missing}")

          print("PASS: AMD64 and ARM64 are published")
          PY

      - name: Pull and verify published image
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'BigLurch/mobil-churn-mini-project'
        env:
          IMAGE: ghcr.io/biglurch/mobil-churn-mini-project:${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          bash scripts/smoke_test.sh "$IMAGE"

  ringlista:
    name: Generate call list
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Generate call list
        run: uv run --frozen --no-sync python -m churn.score

      - name: Upload call list
        uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error

  ci_gate:
  
    name: CI Gate
    runs-on: ubuntu-24.04

    if: always()

    needs:
      - andringar
      - test
      - datakontroll
      - train
      - utvardera
      - docker

    steps:
      - name: Kontrollera pipeline-resultat
        env:
          CHANGES_RESULT: ${{ needs.andringar.result }}
          CI_REQUIRED: ${{ needs.andringar.outputs.ci }}
          TEST_RESULT: ${{ needs.test.result }}
          DATA_RESULT: ${{ needs.datakontroll.result }}
          TRAIN_RESULT: ${{ needs.train.result }}
          EVAL_RESULT: ${{ needs.utvardera.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Ändringskontrollen misslyckades."
            exit 1
          fi

          if [[ "$CI_REQUIRED" == "false" ]]; then
            echo "Endast irrelevanta PR-ändringar. Fullständig CI behövs inte."
            exit 0
          fi

          if [[ "$CI_REQUIRED" != "true" ]]; then
            echo "Ogiltigt värde för CI_REQUIRED."
            exit 1
          fi

          for result in "$TEST_RESULT" "$DATA_RESULT" "$TRAIN_RESULT" "$EVAL_RESULT" "$DOCKER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "CI misslyckades: minst ett obligatoriskt jobb har resultat $result"
              exit 1
            fi
          done

          echo "Alla obligatoriska CI-jobb passerade."

  
  deploy:
    name: Deploy to school Kubernetes
    needs: [ci_gate, docker]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'BigLurch/mobil-churn-mini-project'
    runs-on: ubuntu-24.04

    environment:
      name: production

    permissions:
      contents: read

    env:
      KUBECONFIG: ${{ runner.temp }}/kubeconfig
      CLUSTER_CONTEXT: mlops-ht26
      KUBE_NAMESPACE: jonas-johansson
      IMAGE: ghcr.io/biglurch/mobil-churn-mini-project:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG_SECRET: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG_SECRET"
          umask 077
          printf '%s' "$KUBE_CONFIG_SECRET" > "$KUBECONFIG"

          kubectl config get-contexts -o name | grep -Fx "$CLUSTER_CONTEXT"
          kubectl --context "$CLUSTER_CONTEXT" \
            -n "$KUBE_NAMESPACE" auth can-i patch deployments

      - name: Set deployment image to workflow SHA
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/overlays/cloud/kustomization.yaml")
          content = path.read_text(encoding="utf-8")

          updated, count = re.subn(
              r"(?m)^([ \t]*newTag:[ \t]*).*$",
              lambda match: match.group(1) + os.environ["GITHUB_SHA"],
              content,
          )

          if count != 1:
              raise SystemExit("Expected exactly one newTag in cloud overlay")

          path.write_text(updated, encoding="utf-8")
          print(f"Deployment image SHA: {os.environ['GITHUB_SHA']}")
          PY

          kubectl kustomize k8s/overlays/cloud

      - name: Validate Kubernetes manifests
        run: |
          kubectl --context "$CLUSTER_CONTEXT" \
            -n "$KUBE_NAMESPACE" \
            apply --dry-run=server -k k8s/overlays/cloud

      - name: Deploy to Kubernetes
        run: |
          kubectl --context "$CLUSTER_CONTEXT" \
            -n "$KUBE_NAMESPACE" \
            apply -k k8s/overlays/cloud

      - name: Verify rolling update
        run: |
          kubectl --context "$CLUSTER_CONTEXT" \
            -n "$KUBE_NAMESPACE" \
            rollout status deployment/churn-api --timeout=180s

          ACTUAL_IMAGE=$(kubectl --context "$CLUSTER_CONTEXT" \
            -n "$KUBE_NAMESPACE" \
            get deployment churn-api \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="churn-api")].image}')

          test "$ACTUAL_IMAGE" = "$IMAGE"

          kubectl --context "$CLUSTER_CONTEXT" \
            -n "$KUBE_NAMESPACE" \
            get deployments,pods,services

          echo "PASS: Kubernetes deployment uses $IMAGE"
