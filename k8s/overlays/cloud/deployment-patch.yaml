apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api

spec:
  replicas: 2

  template:
    spec:
      containers:
        - name: churn-api
          resources:
            requests:
              cpu: "75m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
